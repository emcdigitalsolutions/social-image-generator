<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
/* {{BASE_CSS}} */

body {
    background: var(--bg-deep);
    position: relative;
    margin: 0;
    overflow: hidden;
}

.bg-image {
    position: absolute;
    inset: 0;
    background-image: url('{{IMAGE_URL}}');
    background-size: cover;
    background-position: center;
    z-index: 0;
}

.bg-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.55) 100%);
    z-index: 1;
}

/* ── Header logo + brand: 3 varianti × 4 posizioni (5 con center) ─────── */
.header { position: absolute; z-index: 3; display: flex; align-items: center; gap: 10px; }

/* Posizioni */
.header.pos-tl { top: 36px;    left: 36px;   right: auto; bottom: auto; }
.header.pos-tr { top: 36px;    right: 36px;  left: auto;  bottom: auto; }
.header.pos-bl { bottom: 92px; left: 36px;   right: auto; top: auto; }
.header.pos-br { bottom: 92px; right: 36px;  left: auto;  top: auto; }
.header.pos-c  { top: 50%;     left: 50%;    transform: translate(-50%,-50%); right: auto; bottom: auto; }

/* Variante BADGE (default): card bianca con shadow */
.header.var-badge {
    background: rgba(255, 255, 255, 0.92);
    border-radius: 14px;
    padding: 10px 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
}
.header.var-badge .brand-name { color: #1a1a1a; }
.header.var-badge .brand-tagline { color: #555; }

/* Variante WATERMARK: trasparente, look sobrio in bianco */
.header.var-watermark {
    padding: 6px 10px;
    opacity: 0.85;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
}
.header.var-watermark .brand-name { color: #fff; }
.header.var-watermark .brand-tagline { color: rgba(255,255,255,0.8); }
.header.var-watermark svg { filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6)); }

/* Variante BANNER (forza posizione bottom full-width) */
.header.var-banner {
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    top: auto !important;
    transform: none !important;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid rgba(255,255,255,0.12);
    padding: 18px 32px;
    justify-content: center;
}
.header.var-banner .brand-name { color: #fff; font-size: 18px; }
.header.var-banner .brand-tagline { color: rgba(255,255,255,0.85); font-size: 13px; }

.header svg { max-height: 36px; width: auto; }
.header .brand-name {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15px;
}
.header .brand-tagline {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 11px;
    margin-top: 2px;
    letter-spacing: 0.3px;
}
.header .brand-text { display: flex; flex-direction: column; line-height: 1.2; }

/* Caption strip — bottom */
.caption-strip {
    position: absolute;
    bottom: 84px;
    left: 48px;
    right: 48px;
    z-index: 3;
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px;
    padding: 22px 28px;
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 18px;
    font-weight: 500;
    line-height: 1.4;
    max-height: 140px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
}

.bottom-bar {
    position: absolute;
    bottom: 24px;
    left: 0;
    right: 0;
    z-index: 4;
    text-align: center;
    color: rgba(255, 255, 255, 0.85);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}
</style>
</head>
<body>
<div class="bg-image"></div>
<div class="bg-overlay"></div>

{{HEADER_BLOCK}}

{{CAPTION_BLOCK}}

<div class="bottom-bar">{{WEBSITE}}</div>

</body>
</html>
